services:

  postgres:

    image: postgres:18

    container_name: sbns-postgres

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      
    command: >
      postgres
               -c log_min_error_statement=error
               -c log_min_messages=error
               -c log_connections=off
               -c log_disconnections=off

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:

    image: redis:7-alpine

    container_name: sbns-redis

    ports:
      - "6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  kafka:

    image: apache/kafka:4.3.1

    hostname: kafka

    container_name: sbns-kafka

    ports:
      - "9092:9092"

    environment:

      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: "broker,controller"

      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"

      KAFKA_LISTENERS: "CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092"

      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092"

      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"

      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1

      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"

      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"

  notification-consumer:

    build: .

    container_name: sbns-notification-consumer

    command: >
      python consumers/notification_consumer.py

    env_file:
      - .env

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092

    depends_on:
      - kafka

  dynamodb:

    image: amazon/dynamodb-local:latest

    container_name: sbns-dynamodb

    command: >
      -jar DynamoDBLocal.jar
      -sharedDb
      -dbPath ./data

    working_dir: /home/dynamodblocal

    ports:
      - "8001:8000"

    volumes:
      - ./docker/dynamodb:/home/dynamodblocal/data

  aws-cli:

    image: amazon/aws-cli:latest

    profiles:
      - tools

    environment:
      AWS_ACCESS_KEY_ID: dummy
      AWS_SECRET_ACCESS_KEY: dummy
      AWS_DEFAULT_REGION: ap-southeast-2
      NO_PROXY: localhost,127.0.0.1,dynamodb
      no_proxy: localhost,127.0.0.1,dynamodb

    depends_on:
      - dynamodb

  api:

    build: .

    container_name: sbns-api

    env_file:
      - .env

    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  dynamodb_data: